[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
license = "MIT"
name = "EFsymmetry"
version = "0.2.1"
description = "Symmetry detection and ionization-window generation for tailored laser fields"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[tool.setuptools.packages.find]
where = ["src"]
